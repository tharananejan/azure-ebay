services:
  backend:
    build:
      context: ./back-end
    container_name: back-end
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/mydb
      JWT_SECRET: mysecret
    depends_on:
      - mongo

  frontend:
    build:
      context: ./front-end
    container_name: front-end
    ports:
      - "5000:80"
    depends_on:
      - backend

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: